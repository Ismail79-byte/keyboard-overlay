name: Build Windows app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile KeyboardOverlay.exe
        shell: pwsh
        run: .\build.ps1
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardOverlay
          path: dist/KeyboardOverlay.exe
